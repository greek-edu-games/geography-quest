<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Geography Quest</title>
<meta name="theme-color" content="#060d1f">
<meta name="description" content="Learn country names by clicking them on the map, continent by continent. English & Greek.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GeoQuest">
<style>
  :root{
    --bg0:#060d1f; --bg1:#0b1830; --ink:#e8eefc; --dim:#8fa3c8;
    --card:#101d38; --card2:#16264a; --line:#24365c;
    --ocean0:#0a1b3a; --ocean1:#123058;
    --gold:#fbbf24; --red:#f87171; --good:#34d399;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:radial-gradient(120% 90% at 50% 0%,var(--bg1) 0%,var(--bg0) 70%);
    color:var(--ink); overflow:hidden; user-select:none;
  }
  #app{position:fixed;inset:0}

  /* ---------- map ---------- */
  #map{position:absolute;inset:0;width:100%;height:100%;display:block;
    background:
      radial-gradient(90% 70% at 30% 20%, rgba(46,109,180,.14), transparent 60%),
      radial-gradient(80% 60% at 75% 75%, rgba(24,160,190,.10), transparent 60%),
      linear-gradient(180deg,var(--ocean0),var(--ocean1) 55%,var(--ocean0));
    cursor:grab;
    touch-action:none; /* game handles pan/pinch itself */
  }
  #map.dragging{cursor:grabbing}
  #graticule{fill:none;stroke:#3b5a8f;stroke-opacity:.16;stroke-width:.6px;vector-effect:non-scaling-stroke}
  .country{fill:#223250;stroke:#0c1730;stroke-width:.5;stroke-linejoin:round;transition:fill .25s,filter .25s,opacity .4s;pointer-events:none}
  .country.scenery{fill:#1b2742}
  .country.active{fill:#3d4f74;stroke:#0e1c3a;pointer-events:auto;cursor:pointer}
  .country.active:hover{fill:#54689a;filter:drop-shadow(0 0 4px rgba(120,170,255,.55))}
  .country.found{fill:var(--good);stroke:rgba(0,0,0,.35);pointer-events:auto;cursor:default;filter:drop-shadow(0 0 3px rgba(52,211,153,.4))}
  .country.found:hover{fill:#4ee6ab;filter:drop-shadow(0 0 6px rgba(52,211,153,.6))}
  .country.dimmed{opacity:.38}
  .country.wrongflash{animation:wrongflash .55s ease}
  @keyframes wrongflash{0%,60%{fill:var(--red);filter:drop-shadow(0 0 8px rgba(248,113,113,.9))}100%{}}
  .country.hint{animation:hintpulse 0.8s ease 2}
  @keyframes hintpulse{50%{fill:#7fa8e8;filter:drop-shadow(0 0 7px rgba(140,190,255,.9))}}
  .country.reveal{animation:revealpulse 1s ease infinite;pointer-events:auto;cursor:pointer}
  @keyframes revealpulse{50%{fill:var(--gold);filter:drop-shadow(0 0 9px rgba(251,191,36,.95))}}
  .country.justfound{animation:foundpop .6s ease}
  @keyframes foundpop{0%{fill:#fff;filter:drop-shadow(0 0 12px #fff)}100%{}}
  #labels text{fill:#fff;stroke:rgba(5,12,28,.85);stroke-width:.35em;paint-order:stroke;
    font-weight:700;text-anchor:middle;pointer-events:none;opacity:0;transition:opacity .5s;
    font-family:inherit}
  #labels text.show{opacity:.95}

  /* ---------- HUD ---------- */
  .hud{position:absolute;left:0;right:0;display:flex;align-items:center;gap:14px;padding:12px 18px;z-index:5;pointer-events:none}
  .hud>*{pointer-events:auto}
  #hudTop{top:0}
  #contTitle{font-size:15px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
  #progressWrap{flex:1;max-width:340px;height:10px;background:rgba(255,255,255,.08);border-radius:99px;overflow:hidden;box-shadow:inset 0 1px 3px rgba(0,0,0,.5)}
  #progressBar{height:100%;width:0%;border-radius:99px;background:linear-gradient(90deg,var(--accent,#34d399),#fff3);background-color:var(--accent,#34d399);transition:width .45s cubic-bezier(.2,.9,.3,1.2)}
  .stat{font-variant-numeric:tabular-nums;font-weight:800;font-size:18px}
  .stat small{display:block;font-size:10px;font-weight:600;letter-spacing:.14em;color:var(--dim)}
  #streak.hot{color:var(--gold);text-shadow:0 0 12px rgba(251,191,36,.6)}
  .iconbtn{background:rgba(255,255,255,.07);border:1px solid var(--line);color:var(--ink);
    width:38px;height:38px;border-radius:12px;font-size:17px;cursor:pointer;transition:.15s;
    touch-action:manipulation}
  .iconbtn:hover{background:rgba(255,255,255,.15)}
  #zoomCtl{position:absolute;right:14px;bottom:calc(20px + env(safe-area-inset-bottom));z-index:5;
    display:none;flex-direction:column;gap:8px}
  #zoomCtl .iconbtn{width:46px;height:46px;font-size:22px;font-weight:700;
    background:rgba(13,25,52,.85);backdrop-filter:blur(4px)}
  #zoomCtl .iconbtn:active{background:rgba(255,255,255,.2)}

  #prompt{position:absolute;top:64px;left:50%;transform:translateX(-50%);z-index:5;text-align:center;
    background:linear-gradient(180deg,rgba(13,25,52,.92),rgba(10,20,42,.85));
    border:1px solid var(--line);border-radius:18px;padding:10px 30px 13px;
    box-shadow:0 8px 30px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.06);
    backdrop-filter:blur(6px)}
  #prompt .find{font-size:11px;letter-spacing:.28em;color:var(--dim);font-weight:700}
  #promptName{font-size:clamp(22px,4vw,34px);font-weight:900;letter-spacing:.01em;
    background:linear-gradient(180deg,#fff,#bcd0f5);-webkit-background-clip:text;background-clip:text;color:transparent}
  #prompt.pop{animation:promptpop .45s cubic-bezier(.2,1.4,.4,1)}
  @keyframes promptpop{0%{transform:translateX(-50%) scale(.82)}100%{transform:translateX(-50%) scale(1)}}
  #prompt.shake{animation:promptshake .4s}
  @keyframes promptshake{20%{transform:translateX(calc(-50% - 9px))}40%{transform:translateX(calc(-50% + 8px))}60%{transform:translateX(calc(-50% - 5px))}80%{transform:translateX(calc(-50% + 4px))}}
  #promptHint{font-size:12px;color:var(--gold);min-height:15px;font-weight:600}
  #promptEn{font-size:14px;color:var(--dim);font-weight:700;letter-spacing:.03em}
  #promptEn:empty{display:none}

  #toast{position:absolute;bottom:26px;left:50%;transform:translateX(-50%);z-index:5;
    background:rgba(13,25,52,.9);border:1px solid var(--line);border-radius:12px;padding:8px 18px;
    font-weight:700;opacity:0;transition:opacity .3s;pointer-events:none}
  #toast.show{opacity:1}
  #toast .pts{color:var(--good)}

  #vignette{position:absolute;inset:0;pointer-events:none;z-index:4;opacity:0;
    box-shadow:inset 0 0 140px 40px rgba(248,113,113,.55)}
  #vignette.on{animation:vig .5s ease}
  @keyframes vig{20%{opacity:1}100%{opacity:0}}

  #fx{position:absolute;inset:0;pointer-events:none;z-index:6}

  /* ---------- screens ---------- */
  .screen{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:22px;padding:24px;text-align:center;
    background:radial-gradient(100% 100% at 50% 0%,rgba(9,17,36,.55),rgba(6,13,31,.88));
    backdrop-filter:blur(3px);transition:opacity .45s;overflow:auto}
  .screen.hidden{opacity:0;pointer-events:none}
  .logo{font-size:clamp(38px,7vw,64px);font-weight:900;letter-spacing:-.02em;line-height:1.05;
    filter:drop-shadow(0 4px 24px rgba(125,211,252,.25))}
  .logo .grad{background:linear-gradient(120deg,#7dd3fc 0%,#a5b4fc 45%,#f0abfc 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .tagline{color:var(--dim);font-size:15px;max-width:440px;line-height:1.5}
  .bigbtn{font:inherit;font-size:18px;font-weight:800;color:#06122a;cursor:pointer;border:none;
    padding:15px 42px;border-radius:16px;letter-spacing:.02em;
    background:linear-gradient(180deg,#8be9c9,#34d399);
    box-shadow:0 6px 24px rgba(52,211,153,.35), inset 0 1px 0 rgba(255,255,255,.5);
    transition:transform .12s, box-shadow .12s}
  .bigbtn:hover{transform:translateY(-2px) scale(1.02);box-shadow:0 10px 30px rgba(52,211,153,.45), inset 0 1px 0 rgba(255,255,255,.5)}
  .bigbtn:active{transform:scale(.98)}
  .bigbtn.alt{background:linear-gradient(180deg,#a5c8ff,#60a5fa);box-shadow:0 6px 24px rgba(96,165,250,.35), inset 0 1px 0 rgba(255,255,255,.5)}
  .linkbtn{background:none;border:none;color:var(--dim);font:inherit;font-size:14px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
  .linkbtn:hover{color:var(--ink)}
  #langRow{display:flex;gap:8px;background:rgba(255,255,255,.06);border:1px solid var(--line);
    border-radius:99px;padding:4px}
  .langbtn{font:inherit;font-size:13.5px;font-weight:700;color:var(--dim);background:none;border:none;
    padding:7px 18px;border-radius:99px;cursor:pointer;transition:.15s;touch-action:manipulation}
  .langbtn.on{background:linear-gradient(180deg,#a5c8ff,#60a5fa);color:#06122a}

  #grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;width:min(860px,94vw)}
  .card{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);
    border-radius:18px;padding:14px 14px 12px;cursor:pointer;transition:.18s;text-align:left;color:var(--ink);font:inherit;
    display:flex;flex-direction:column;gap:8px;position:relative;overflow:hidden}
  .card:hover{transform:translateY(-3px);border-color:var(--ac);box-shadow:0 10px 28px rgba(0,0,0,.4),0 0 0 1px var(--ac) inset}
  .card svg{width:100%;height:86px;display:block;filter:drop-shadow(0 2px 6px rgba(0,0,0,.5))}
  .card .cname{font-weight:800;font-size:16px}
  .card .cmeta{display:flex;justify-content:space-between;align-items:center;color:var(--dim);font-size:12.5px;font-weight:600}
  .card .stars{color:var(--gold);letter-spacing:2px;font-size:13px}
  .card .best{color:var(--dim)}

  /* results */
  #resCard{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);
    border-radius:24px;padding:34px 46px;box-shadow:0 20px 60px rgba(0,0,0,.5);max-width:480px}
  #resTitle{font-size:30px;font-weight:900;margin-bottom:2px}
  #resSub{color:var(--dim);font-weight:600;margin-bottom:14px}
  #resStars{font-size:44px;letter-spacing:8px;min-height:58px}
  #resStars span{display:inline-block;opacity:.18;transform:scale(.6);transition:.3s cubic-bezier(.2,1.6,.4,1)}
  #resStars span.lit{opacity:1;transform:scale(1);color:var(--gold);text-shadow:0 0 22px rgba(251,191,36,.7)}
  .resrow{display:flex;justify-content:space-between;gap:40px;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.06);font-weight:600}
  .resrow b{font-variant-numeric:tabular-nums}
  #resBtns{display:flex;gap:12px;justify-content:center;margin-top:22px;flex-wrap:wrap}
  #newBest{color:var(--good);font-weight:800;min-height:20px;margin-top:10px}

  @media (max-width:640px){
    #hudTop{gap:8px;padding:8px 10px}
    #contTitle{display:none}
    #prompt{top:56px;padding:8px 18px 10px;width:max-content;max-width:92vw}
    #resCard{padding:24px 20px}
  }
</style>
</head>
<body>
<div id="app">
  <svg id="map" viewBox="0 0 1000 520" preserveAspectRatio="xMidYMid meet" aria-label="World map">
    <path id="graticule"/>
    <g id="countries"></g>
    <g id="labels"></g>
  </svg>
  <div id="vignette"></div>
  <canvas id="fx"></canvas>

  <div class="hud" id="hudTop" style="display:none">
    <button class="iconbtn" id="btnQuit" title="Back to menu">←</button>
    <div id="contTitle"></div>
    <div id="progressWrap"><div id="progressBar"></div></div>
    <div class="stat"><small id="scoreLbl">SCORE</small><span id="score">0</span></div>
    <div class="stat"><small id="streakLbl">STREAK</small><span id="streak">0</span></div>
    <button class="iconbtn" id="btnSound" title="Toggle sound">🔊</button>
  </div>

  <div id="prompt" style="display:none">
    <div class="find" id="findLbl">FIND</div>
    <div id="promptName">France</div>
    <div id="promptEn"></div>
    <div id="promptHint"></div>
  </div>

  <div id="toast"></div>

  <div id="zoomCtl">
    <button class="iconbtn" id="zoomIn" title="Zoom in" aria-label="Zoom in">＋</button>
    <button class="iconbtn" id="zoomOut" title="Zoom out" aria-label="Zoom out">－</button>
    <button class="iconbtn" id="zoomFit" title="Fit continent" aria-label="Fit continent">⛶</button>
  </div>

  <div class="screen" id="titleScreen">
    <div class="logo">🌍 <span class="grad">Geography Quest</span></div>
    <div class="tagline" id="tagline"></div>
    <button class="bigbtn" id="btnTour">▶&nbsp; Grand Tour</button>
    <button class="bigbtn alt" id="btnPick">Choose a Continent</button>
    <div id="langRow">
      <button class="langbtn" data-lang="en">English</button>
      <button class="langbtn" data-lang="el">Ελληνικά</button>
    </div>
  </div>

  <div class="screen hidden" id="selectScreen">
    <div class="logo" style="font-size:clamp(26px,4vw,38px)"><span class="grad" id="selectTitle">Choose your continent</span></div>
    <div id="grid"></div>
    <button class="linkbtn" id="btnBackTitle">← back</button>
  </div>

  <div class="screen hidden" id="resultsScreen">
    <div id="resCard">
      <div id="resTitle">Continent complete!</div>
      <div id="resSub"></div>
      <div id="resStars"><span>★</span><span>★</span><span>★</span></div>
      <div class="resrow"><span id="rowScore">Score</span><b id="resScore">0</b></div>
      <div class="resrow"><span id="rowAcc">First-try accuracy</span><b id="resAcc">0%</b></div>
      <div class="resrow"><span id="rowStreak">Best streak</span><b id="resStreak">0</b></div>
      <div id="newBest"></div>
      <div id="resBtns">
        <button class="bigbtn alt" id="btnReplay">Replay</button>
        <button class="bigbtn" id="btnNext">Next</button>
        <button class="linkbtn" id="btnMenu">menu</button>
      </div>
    </div>
  </div>
</div>

<script src="map-data.js"></script>

let ac = null, master = null;
function ensureAudio(){

  tick(){ if(!ac)return; tone(1900,ac.currentTime,.03,{type:'sine',vol:.028}); },

const fx = $('fx'), fctx = fx.getContext('2d');
let parts = [];
function sizeFx(){ const d = window.devicePixelRatio||1;
  fx.width = innerWidth*d; fx.height = innerHeight*d; fctx.setTransform(d,0,0,d,0,0); }
sizeFx(); addEventListener('resize', sizeFx);
function svgToScreen(cx, cy){
  const r = svg.getBoundingClientRect();
  const s = Math.min(r.width/vb.w, r.height/vb.h);
  const ox = r.left + (r.width - vb.w*s)/2 - vb.x*s;

  for (let i=0;i<n;i++){
    const a = Math.random()*Math.PI*2, sp = 2.4 + Math.random()*5.5;
    parts.push({ x, y, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp - 2.6,
      rot: Math.random()*Math.PI, vr:(Math.random()-.5)*.34,
      w: 4+Math.random()*6, h: 3+Math.random()*4, life: 1,
      col: Math.random()<.65 ? color : ['#ffffff','#fbbf24','#7dd3fc'][Math.floor(Math.random()*3)] });

  if (!parts.length){ fctx.clearRect(0,0,innerWidth,innerHeight); return; }
  fctx.clearRect(0,0,innerWidth,innerHeight);
  parts = parts.filter(p => p.life > 0);
  for (const p of parts){
    p.x += p.vx; p.y += p.vy; p.vy += .16; p.vx *= .99; p.rot += p.vr; p.life -= .012;
    fctx.save(); fctx.globalAlpha = Math.max(0, Math.min(1, p.life*1.6));

  if (game.revealed){ pts = 0; note = L.mem; }

    const secs = (performance.now() - game.roundStart) / 1000;
    const bonus = Math.max(0, Math.round(50 - secs * 10));

  $('vignette').classList.remove('on'); void $('vignette').offsetWidth; $('vignette').classList.add('on');
  const p = $('prompt'); p.classList.remove('shake'); void p.offsetWidth; p.classList.add('shake');
  const wrongC = clickedEl.dataset.id ? byId[clickedEl.dataset.id] : null;
  if (game.attempts === 1){
    if (wrongC) $('promptHint').textContent = T().hintWas(cName(wrongC));
    hint(target, 3);
  } else if (game.attempts === 2){
    $('promptHint').textContent = T().hintMore;
    hint(target, 1);
  } else if (game.attempts >= 3 && !game.revealed){
    game.revealed = true;
    const el = byId[target.id].el;
    el.classList.remove('active'); el.classList.add('reveal');
    $('promptHint').textContent = T().hintReveal;
  }
  updateHud();
}
function hint(target, n){
  const pool = game.queue.slice(game.idx + 1).map(c => byId[c.id].el);
  const set = [byId[target.id].el];
  while (set.length < n && pool.length){
    const i = Math.floor(Math.random() * pool.length);
    set.push(pool.splice(i,1)[0]);
  }
  for (const el of set){
    el.classList.remove('hint'); void el.getBBox; el.classList.add('hint');
    setTimeout(()=>el.classList.remove('hint'), 1700);
  }
}
gCountries.addEventListener('click', ev => {
  if (game.screen !== 'play' || suppressClick || tween || game.levelDone) return;
  const el = ev.target;
  if (!el.dataset || !el.dataset.id) return;
  const target = game.queue[game.idx];
  if (!target) return;
  if (+el.dataset.id === +target.id){
    if (el.classList.contains('found')) return;
    handleCorrect(target);
  } else if (el.classList.contains('active')){
    handleWrong(el);
  }
});

/* ---------- results ---------- */
function endLevel(){
  game.levelDone = true;
  $('prompt').style.display = 'none';
  $('progressBar').style.width = '100%';
  const total = game.queue.length;
  const acc = game.firstTry / total;
  const stars = acc >= .9 ? 3 : acc >= .68 ? 2 : acc >= .42 ? 1 : 0;
  const rec = store.continents[game.cont] || { stars: 0, best: 0 };
  const isBest = game.score > rec.best;
  rec.stars = Math.max(rec.stars, stars);
  rec.best = Math.max(rec.best, game.score);
  store.continents[game.cont] = rec; save();

  flyTo(pad(MAP.continents[game.cont], 0.22), 1600);
  setTimeout(() => {
    game.screen = 'results';
    $('resTitle').textContent = EMOJI[game.cont] + ' ' + T().complete(contName(game.cont));
    $('resSub').textContent = T().sub(game.firstTry, total);
    $('resScore').textContent = game.score;
    $('resAcc').textContent = Math.round(acc * 100) + '%';
    $('resStreak').textContent = game.bestStreak;
    $('newBest').textContent = isBest && rec.best > 0 ? T().newBest : '';
    const spans = $('resStars').querySelectorAll('span');
    spans.forEach(s => s.classList.remove('lit'));
    const nextCont = game.tour && game.tourIdx < CONTS.length - 1 ? CONTS[game.tourIdx + 1] : null;
    $('btnNext').textContent = nextCont ? T().nextC(contName(nextCont)) : T().conts;
    showScreen('resultsScreen');
    sfx.fanfare();
    for (let i = 0; i < stars; i++)
      setTimeout(() => { spans[i].classList.add('lit'); sfx.star(i); }, 700 + i * 420);
  }, 900);
}
$('btnReplay').addEventListener('click', () => startLevel(game.cont));
$('btnNext').addEventListener('click', () => {
  if (game.tour && game.tourIdx < CONTS.length - 1){
    game.tourIdx++;
    startLevel(CONTS[game.tourIdx]);
  } else goSelect();
});
$('btnMenu').addEventListener('click', goTitle);
$('btnQuit').addEventListener('click', goTitle);
addEventListener('keydown', ev => { if (ev.key === 'Escape' && game.screen === 'play') goTitle(); });

/* ---------- menus ---------- */
function goTitle(){
  game.screen = 'title'; game.tour = false;
  $('hudTop').style.display = 'none';
  $('zoomCtl').style.display = 'none';
  $('prompt').style.display = 'none';
  resetMapClasses();
  showScreen('titleScreen');
  panBounds = null;
  driftBase = {...WORLD};
  flyTo(WORLD, 1400);
  setTimeout(()=>{ idleDrift = true; }, 1450);
}
function goSelect(){
  game.screen = 'select'; game.tour = false;
  $('hudTop').style.display = 'none';
  $('zoomCtl').style.display = 'none';
  $('prompt').style.display = 'none';
  buildGrid();
  showScreen('selectScreen');
}
function resetMapClasses(){
  gLabels.innerHTML = '';
  for (const id in byId){
    const c = byId[id];
    c.el.classList.remove('found','reveal','hint','wrongflash','justfound','dimmed','active');
  }
}
function buildGrid(){
  const grid = $('grid'); grid.innerHTML = '';
  for (const cont of CONTS){
    const rec = store.continents[cont] || { stars: 0, best: 0 };
    const n = MAP.countries.filter(c => c.c === cont && c.q).length;
    const box = pad(MAP.continents[cont], 0.06);
    const paths = MAP.countries.filter(c => c.c === cont)
      .map(c => `<path d="${c.d}" fill="${ACCENT[cont]}" fill-opacity=".85" stroke="#0a1428" stroke-width=".6"/>`).join('');
    const card = document.createElement('button');
    card.className = 'card';
    card.style.setProperty('--ac', ACCENT[cont]);
    card.innerHTML = `
      <svg viewBox="${box.x} ${box.y} ${box.w} ${box.h}" preserveAspectRatio="xMidYMid meet">${paths}</svg>
      <div class="cname">${EMOJI[cont]} ${contName(cont)}</div>
      <div class="cmeta">
        <span>${n} ${T().countries}</span>
        <span class="stars">${'★'.repeat(rec.stars)}${'☆'.repeat(3-rec.stars)}</span>
      </div>
      ${rec.best ? `<div class="cmeta"><span class="best">${T().best} ${rec.best}</span></div>` : ''}`;
    card.addEventListener('click', () => startLevel(cont));
    grid.appendChild(card);
  }
}
document.querySelectorAll('.langbtn').forEach(b => b.addEventListener('click', () => {
  store.lang = b.dataset.lang; save(); applyLang();
}));
applyLang();
$('btnTour').addEventListener('click', () => { game.tour = true; game.tourIdx = 0; startLevel(CONTS[0]); });
$('btnPick').addEventListener('click', () => { ensureAudio(); goSelect(); });
$('btnBackTitle').addEventListener('click', goTitle);

/* ============================== main loop ============================== */
function loop(t){
  requestAnimationFrame(loop);
  if (tween){
    const k = Math.min(1, (t - tween.t0) / tween.dur);
    const e = ease(k);
    vb.x = tween.from.x + (tween.to.x - tween.from.x) * e;
    vb.y = tween.from.y + (tween.to.y - tween.from.y) * e;
    vb.w = tween.from.w + (tween.to.w - tween.from.w) * e;
    vb.h = tween.from.h + (tween.to.h - tween.from.h) * e;
    setVB();
    if (k >= 1) tween = null;
  } else if (idleDrift && game.screen !== 'play'){
    vb.x = driftBase.x + Math.sin(t / 11000) * 14;
    vb.y = driftBase.y + Math.cos(t / 13000) * 7;
    setVB();
  }
  drawFx();
}
requestAnimationFrame(loop);
setVB();

/* ---------- PWA ---------- */
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
}
</script>
